<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>creation d'une mini calculatrice</title>
    <link rel="stylesheet" href="style/applications.css" />
  </head>
  <body>
    <form class="formulaire">
      <div class="form-group">
        <label for="name">nom complet</label>
        <input type="text" id="name" placeholder="nom complet" />
      </div>
      <div class="form-group">
        <label for="firstnumber">premier nombre</label>
        <input type="number" id="firstnumber" />
      </div>
      <div class="form-group">
        <label for="secondnumber">second nombre</label>
        <input type="number" id="secondnumber" />
      </div>
      <div class="form-group">
        <label for="operations">operations</label>
        <select name="operations" id="operations">
          <option value="" selected disabled>choisir une opération</option>
          <option value="+">addition</option>
          <option value="-">soustraction</option>
          <option value="*">multiplication</option>
          <option value="/">division</option>
          <option value="%">modulo</option>
        </select>
      </div>
      <button type="button" id="btncalculer">calculer</button>
      <p id="resultat">resultat</p>
    </form>

    <script src="scripts/operations.js"></script>
  </body>
</html>
